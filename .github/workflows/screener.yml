name: F&O Morning Screener

on:
  schedule:
    # 6:30 AM IST = 01:00 UTC, Monday–Friday
    - cron: '0 0 * * 2-6'
  workflow_dispatch:
    inputs:
      date:
        description: 'Trade date YYYY-MM-DD (optional, defaults to last trading day)'
        required: false
        default: ''

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout code ───────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ──────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. Install dependencies ───────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Write Google credentials to file ──────
      - name: Write Google credentials
        run: |
          mkdir -p credentials
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials/service_account.json

      # ── 5. Create logs directory ──────────────────
      - name: Create logs directory
        run: mkdir -p logs

      # ── 6. Run screener (with retry) ──────────────
      - name: Run screener.py
        id: screener
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.date }}"
          fi

          for attempt in 1 2 3; do
            echo "Screener attempt $attempt/3..."
            if python screener.py $DATE_ARG; then
              echo "Screener succeeded on attempt $attempt"
              break
            fi
            if [ $attempt -lt 3 ]; then
              echo "Waiting 60 seconds before retry..."
              sleep 60
            else
              echo "All screener attempts failed"
              exit 1
            fi
          done
        continue-on-error: false

      # ── 7. Send Telegram error if screener failed ─
      - name: Send screener failure alert
        if: failure() && steps.screener.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python telegram_alert.py --test-error "screener.py failed after 3 retries. Check GitHub Actions logs."

      # ── 8. Update Google Sheets ───────────────────
      - name: Update Google Sheets
        id: sheets
        env:
          GOOGLE_CREDENTIALS_PATH: credentials/service_account.json
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_STR=$(echo "${{ github.event.inputs.date }}" | tr -d '-')
            python sheets_updater.py --json logs/screener_results_${DATE_STR}.json
          else
            python sheets_updater.py
          fi
        continue-on-error: false

      # ── 9. Send Telegram error if sheets failed ───
      - name: Send sheets failure alert
        if: failure() && steps.sheets.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python telegram_alert.py --test-error "sheets_updater.py failed. Google Sheets not updated today."

      # ── 10. Send Telegram morning brief ───────────
      - name: Send Telegram morning brief
        id: telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_STR=$(echo "${{ github.event.inputs.date }}" | tr -d '-')
            python telegram_alert.py --json logs/screener_results_${DATE_STR}.json
          else
            python telegram_alert.py
          fi
        continue-on-error: false

      # ── 11. Send Telegram error if message failed ─
      - name: Send Telegram failure alert
        if: failure() && steps.telegram.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python telegram_alert.py --test-error "telegram_alert.py failed. Morning brief not sent today."

      # ── 12. Upload logs as artifacts ──────────────
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-logs-${{ github.run_number }}
          path: logs/
          retention-days: 30
